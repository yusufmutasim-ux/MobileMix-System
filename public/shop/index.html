<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <title>المتجر</title>
  <meta name="description" content="اطلب أونلاين — إكسسوارات موبايل، شواحن، كابلات، سماعات وباور بانك أصلية بضمان">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-180.png?v=2">
  <link rel="stylesheet" href="/shop/shop.css">
  <script>
    // Light / dark: the customer's choice, else the phone's setting (set before paint, no flash)
    try { const t = localStorage.getItem('mm_shop_theme'); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
  </script>
</head>
<body>
  <div class="strip" id="strip" hidden></div>
  <header class="top" id="top">
    <div class="top-in wrap">
      <a class="brand" href="#/" aria-label="الرئيسية"><img class="logo" src="/brand/mark.svg" alt=""><span id="title">المتجر</span></a>
      <form class="search" id="top-search" role="search" autocomplete="off">
        <input type="search" name="q" placeholder="دوّر على شاحن، كابل، سماعة…" enterkeyhint="search" aria-label="بحث">
        <button aria-label="بحث"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <div class="suggest" id="suggest" hidden></div>
      </form>
      <div class="top-icons">
        <button class="icon-btn round-only" type="button" id="theme-btn" aria-label="الوضع الفاتح / الغامق" title="الوضع الفاتح / الغامق">
          <svg class="i-moon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <a class="icon-btn round-only" href="#/fav" aria-label="المفضلة" title="المفضلة">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5c-2.2 4.6-9.2 9-9.2 9z"/></svg>
          <b class="count fav-count" hidden>0</b></a>
        <a class="icon-btn hide-sm" href="#/mine" aria-label="طلباتي" title="طلباتي">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3h12l1 4H5z"/><path d="M5 7v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7"/><path d="M9 11a3 3 0 0 0 6 0"/></svg><span>طلباتي</span></a>
        <button class="icon-btn cart-btn" type="button" data-open-cart aria-label="السلة" title="السلة">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
          <b class="count" hidden>0</b><span>السلة</span></button>
      </div>
    </div>
    <nav class="catbar-wrap"><div class="catbar wrap" id="catbar"></div></nav>
  </header>

  <main id="view" class="wrap"></main>
  <footer class="foot" id="foot"></footer>
  <div id="sticky-slot"></div>

  <!-- phones: app-like bottom bar -->
  <nav class="bottom-nav" id="bottom-nav">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>الرئيسية</a>
    <a href="#/cats" data-tab="cats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>الأقسام</a>
    <a href="#/list?deals=1" data-tab="deals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>العروض</a>
    <button type="button" data-open-cart><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg><b class="count" hidden>0</b>السلة</button>
    <a href="#/mine" data-tab="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>طلباتي</a>
  </nav>

  <!-- the cart slides in from the side -->
  <div class="drawer-back" id="drawer-back" hidden></div>
  <aside class="drawer" id="drawer" aria-label="السلة" aria-hidden="true">
    <div class="drawer-head"><h2>سلة المشتريات</h2><button type="button" class="x" id="drawer-x" aria-label="قفل">✕</button></div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <a class="wa-float" id="wa-float" target="_blank" rel="noopener" hidden aria-label="واتساب">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5 5 16a8.5 8.5 0 1 1 3.2 3.1z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a5 5 0 0 1-2.6-2.6l.8-1-1-2z"/></svg></a>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/shop/shop.js"></script>
</body>
</html>

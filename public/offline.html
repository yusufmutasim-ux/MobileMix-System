<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Mix — مفيش اتصال</title>
  <style>
    @font-face { font-family: 'Plex Arabic'; font-weight: 400; src: url('/fonts/plex/ibm-plex-sans-arabic-arabic-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Plex Arabic'; font-weight: 500; src: url('/fonts/plex/ibm-plex-sans-arabic-arabic-500-normal.woff2') format('woff2'); }
    :root { --violet: #141414; --ink: #141414; --slate: #5f5f5f; --cloud: #efefef; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--cloud); color: var(--ink);
      font-family: 'Plex Arabic', 'Segoe UI', Tahoma, sans-serif; padding: 24px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 30px; padding: 32px 28px; max-width: 440px; width: 100%; text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    @media (prefers-color-scheme: dark) { body { background: #0b0b0b; color: #f2f2f2; } .card { background: #1a1a1a; } p, ul { color: #a9a9a9 !important; } button { background: #C2D64F !important; color: #141414 !important; } }
    h1 { font-weight: 700; font-size: 24px; margin: 16px 0 8px; }
    p { color: var(--slate); line-height: 1.7; margin: 0 0 8px; }
    ul { text-align: right; color: var(--slate); line-height: 1.9; padding-right: 20px; margin: 12px 0 20px; }
    button { background: var(--violet); color: #fff; border: 0; border-radius: 160px; padding: 13px 28px; font: inherit; font-weight: 500; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" width="76" height="76" alt="" style="border-radius:22px">
    <h1>مش قادر أوصل للسيستم</h1>
    <p>الجهاز ده مش قادر يوصل للسيرفر دلوقتي.</p>
    <ul>
      <li>اتأكد إن النت أو الواي فاي شغال.</li>
      <li>لو السيستم على جهاز المحل: اتأكد إن الجهاز شغال والبرنامج مفتوح عليه (ولو إنت برة المحل، إن Tailscale مفتوح).</li>
      <li>لو السيستم أونلاين: جرب كمان دقيقة.</li>
    </ul>
    <button onclick="location.reload()">جرّب تاني</button>
  </div>
</body>
</html>
